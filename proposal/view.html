<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Proposal · NWA Ads</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/shared/js/env.js?v=20260715b"></script>
<script src="/shared/js/venue-type-img.js?v=20260715c"></script>

<style>
:root {
  --bg:      #faf8f3;
  --ink:     #1a1206;
  --ink2:    #3d3023;
  --muted:   #9b8f7a;
  --muted2:  #6b5d4a;
  --border:  #e8e3d8;
  --surface: #fff;
  --sf2:     #faf8f3;
  --accent:  #c84f18;
  --orange:  #f0905a;
  --dark:    #1a1206;
  --green:   #1a7a3a;
  --r:       14px;
  --r-sm:    8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body { font-family: 'Instrument Sans', 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }

/* ── NAV ── */
.nav {
  background: var(--dark);
  padding: 0 32px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-logo { display: flex; align-items: center; gap: 10px; }
.nav-wordmark { font-family: Georgia, serif; font-size: 17px; font-weight: 700; color: #fffef9; }
.nav-wordmark span { color: var(--orange); }
.nav-label { font-size: 11px; color: rgba(255,255,255,0.5); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.nav-right { display: flex; align-items: center; gap: 14px; }
.nav-csv-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fffef9;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
}
.nav-csv-btn:hover { background: rgba(255,255,255,0.16); }
@media (max-width: 540px) {
  .nav-label { display: none; }
}

/* ── BANNER ── */
.banner {
  background: var(--orange);
  color: #fff;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  padding: 7px 16px;
  letter-spacing: 0.3px;
}

/* ── LAYOUT ── */
.container { max-width: 780px; margin: 0 auto; padding: 40px 24px 96px; }

/* ── CARDS ── */
.card {
  background: var(--surface);
  border-radius: var(--r);
  border: 1.5px solid var(--border);
  padding: 28px 32px;
  margin-bottom: 24px;
}

/* ── MAP ── */
#proposal-map {
  height: 340px;
  width: 100%;
  border-radius: var(--r-sm);
  overflow: hidden;
  background: #eee;
}
.map-caption {
  margin-top: 12px;
  font-size: 12.5px;
  color: var(--muted2);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── COVER ── */
.cover-eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 8px; }
.cover-company { font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: var(--ink); line-height: 1.2; }
.cover-contact { margin-top: 4px; font-size: 14px; color: var(--muted2); }
.cover-meta { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); display: flex; gap: 28px; flex-wrap: wrap; }
.cover-meta-item { display: flex; flex-direction: column; gap: 3px; }
.cover-meta-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }
.cover-meta-val { font-size: 14px; color: var(--ink2); font-weight: 600; }
.cover-divider { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
.cover-note-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 8px; }
.cover-note { font-size: 14px; color: var(--ink2); line-height: 1.65; font-style: italic; }
.cover-sender { margin-top: 10px; font-size: 12px; color: var(--muted); font-weight: 600; }

/* ── STAT BADGES ── */
.stats-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.stat-badge {
  text-align: center;
  padding: 20px 24px;
  background: var(--surface);
  border-radius: 12px;
  border: 1.5px solid var(--border);
  flex: 1;
  min-width: 130px;
}
.stat-val { font-family: Georgia, serif; font-size: 26px; font-weight: 700; color: var(--ink); margin-bottom: 4px; line-height: 1; }
.stat-val.accent { color: var(--accent); }
.stat-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

/* ── GOAL CHIP ── */
.goal-row { margin-bottom: 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.goal-eyebrow { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
.goal-chip {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink2);
}

/* ── SECTION HEADING ── */
.section-head { margin-bottom: 16px; }
.section-head h2 { font-family: Georgia, serif; font-size: 22px; font-weight: 700; color: var(--ink); }
.section-head p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

/* ── SCREEN CARD ── */
.screen-card {
  background: var(--surface);
  border-radius: var(--r);
  border: 1.5px solid var(--border);
  overflow: hidden;
  margin-bottom: 24px;
}
.screen-media {
  position: relative;
  height: 220px;
  overflow: hidden;
  background: var(--border);
}
.screen-media img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: none;
}
.screen-media iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  pointer-events: none;
}
.screen-media-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.68) 100%);
  pointer-events: none;
}
.screen-type-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(255,255,255,0.93);
  backdrop-filter: blur(4px);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
  pointer-events: none;
}
.screen-photo-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(0,0,0,0.48);
  border-radius: 12px;
  padding: 3px 9px;
  font-size: 10px;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
  letter-spacing: 0.3px;
  pointer-events: none;
}
.screen-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px 16px;
  pointer-events: none;
}
.screen-overlay-name {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
  text-shadow: 0 1px 3px rgba(0,0,0,0.6);
}
.screen-overlay-area {
  font-size: 12px;
  color: rgba(255,255,255,0.85);
  margin-top: 2px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}
.screen-body { padding: 18px 20px 20px; }
.screen-stats { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.screen-stat {
  flex: 1;
  min-width: 90px;
  background: var(--sf2);
  border-radius: var(--r-sm);
  padding: 10px 12px;
}
.screen-stat-lbl { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px; }
.screen-stat-val { font-size: 20px; font-weight: 700; font-family: Georgia, serif; color: var(--ink); }
.screen-stat-val.accent { color: var(--accent); }
.screen-stat-val small { font-size: 12px; color: var(--muted); font-family: inherit; }
.screen-audience {
  font-size: 12px;
  color: var(--muted2);
  background: var(--sf2);
  border-radius: var(--r-sm);
  padding: 8px 12px;
  margin-bottom: 12px;
  line-height: 1.5;
}
.screen-audience strong { font-weight: 700; }
.screen-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.screen-total-lbl { font-size: 12px; color: var(--muted); }
.screen-total-val { font-size: 16px; font-weight: 700; font-family: Georgia, serif; color: var(--ink); }

/* ── PRICING ── */
.pricing-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #f0ebe0;
  gap: 10px;
}
.pricing-row-left { display: flex; align-items: center; gap: 8px; }
.pricing-row-icon { font-size: 18px; }
.pricing-row-name { font-size: 13px; font-weight: 600; }
.pricing-row-sub { font-size: 11px; color: var(--muted); }
.pricing-row-right { text-align: right; flex-shrink: 0; }
.pricing-row-total { font-size: 14px; font-weight: 700; color: var(--accent); }
.pricing-row-unit { font-size: 10px; color: var(--muted); }
.pricing-summary { padding-top: 12px; margin-top: 4px; }
.pricing-line { display: flex; justify-content: space-between; margin-bottom: 8px; }
.pricing-line span:first-child { font-size: 13px; color: var(--muted2); }
.pricing-line span:last-child { font-size: 13px; font-weight: 600; }
.pricing-line.green span { color: var(--green); }
.pricing-grand { display: flex; justify-content: space-between; padding-top: 12px; border-top: 2px solid var(--border); }
.pricing-grand-lbl { font-size: 16px; font-weight: 700; font-family: Georgia, serif; }
.pricing-grand-lbl small { font-size: 12px; font-weight: 400; color: var(--muted); font-family: inherit; }
.pricing-grand-val { font-size: 22px; font-weight: 700; font-family: Georgia, serif; color: var(--accent); }

/* ── INCLUDED ── */
.included-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.included-item { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--ink2); }
.included-item-icon { font-size: 16px; flex-shrink: 0; }
.included-item span { line-height: 1.5; }

/* ── CTA FOOTER ── */
.cta {
  background: var(--dark);
  border-radius: var(--r);
  padding: 32px 36px;
  text-align: center;
}
.cta h2 { font-family: Georgia, serif; font-size: 24px; font-weight: 700; color: #fffef9; margin-bottom: 8px; }
.cta p { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.6; margin-bottom: 24px; }
.cta-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
.cta-btn-primary {
  display: inline-block;
  background: var(--orange);
  color: #fff;
  text-decoration: none;
  padding: 13px 32px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
}
.cta-btn-secondary {
  display: inline-block;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fffef9;
  text-decoration: none;
  padding: 13px 24px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
}
.cta-fine { font-size: 11px; color: rgba(255,255,255,0.35); }

/* ── ERROR ── */
.error-state {
  max-width: 520px;
  margin: 80px auto;
  text-align: center;
  padding: 0 24px;
}
.error-state h2 { font-family: Georgia, serif; font-size: 22px; font-weight: 700; margin-bottom: 12px; }
.error-state p { font-size: 14px; color: var(--muted2); line-height: 1.6; }

/* ── RESPONSIVE ── */
@media (max-width: 540px) {
  .nav { padding: 0 18px; }
  .container { padding: 24px 16px 80px; }
  .card { padding: 20px 18px; }
  .cover-company { font-size: 24px; }
  .stats-row { gap: 8px; }
  .stat-badge { min-width: 110px; padding: 16px 14px; }
  .stat-val { font-size: 22px; }
  .included-grid { grid-template-columns: 1fr; }
  .cta { padding: 28px 20px; }
  .screen-media { height: 180px; }
  #proposal-map { height: 240px; }
}
</style>
</head>
<body>

<!-- Rendered by JS below -->
<div id="root"></div>

<script>
/* ─────────────────────────────────────────
   Helpers
───────────────────────────────────────── */
const TYPE_LABEL = {
  billboard:   "Digital Billboard",
  gym:         "Gym Screen",
  cinema:      "Cinema Screen",
  gasstation:  "Gas Station",
  grocery:     "Grocery Store",
  healthcare:  "Medical Office",
  rideshare:   "Rideshare Interior",
  dining:      "Casual Dining",
  retail:      "Retail Screen",
  bar:         "Bar Screen",
  sports:      "Sports Venue",
  education:   "College Campus",
  residential: "Apartment Screen",
  airport:     "Airport Screen",
};

function fmtMoney(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}

function incLabel(inc) {
  if (inc === 'monthly') return { unit: 'month', short: '/mo' };
  if (inc === 'daily')   return { unit: 'day',   short: '/day' };
  return { unit: 'week', short: '/wk' };
}

function expiresDate(created) {
  const d = new Date(created + 'T00:00:00');
  d.setDate(d.getDate() + 7);
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

function fmtDateShort(str) {
  if (!str) return '';
  const d = new Date(str + 'T00:00:00');
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtDateRange(start, end) {
  if (!start && !end) return '';
  if (start && end) return fmtDateShort(start) + ' – ' + fmtDateShort(end);
  return fmtDateShort(start || end);
}

function venueMixSummary(screens) {
  const counts = {};
  screens.forEach(function(s) {
    const label = s.type || 'Screen';
    counts[label] = (counts[label] || 0) + 1;
  });
  return Object.keys(counts)
    .map(function(label) { return counts[label] + ' ' + label + (counts[label] !== 1 ? 's' : ''); })
    .join(' · ');
}

function isWalmartGoal(goal) {
  return !!goal && (goal.includes('Walmart') || goal.includes("Sam's"));
}

/* ─────────────────────────────────────────
   Map — renders the coverage/proximity map
   into #proposal-map after renderPage() has
   inserted the container into the DOM.
───────────────────────────────────────── */
let PROPOSAL_MAP = null;
const VENUE_MAP_COLOR = {
  billboard: '#c84f18', gym: '#2f7d5c', cinema: '#5b4b8a', gasstation: '#b5451f',
  grocery: '#1a7a3a', healthcare: '#2563a8', rideshare: '#6b5d4a', dining: '#c8440a',
  retail: '#9b6b1f', bar: '#7a3d9b', sports: '#1f6d8c', education: '#8a5a2f',
  residential: '#4a4540', airport: '#2f5d8a',
};
function venueMapColor(type) { return VENUE_MAP_COLOR[type] || '#8b7a5e'; }

function screenMapIcon(type) {
  const color = venueMapColor(type);
  return L.divIcon({
    className: '',
    html: `<div style="width:24px;height:24px;border-radius:50%;background:${color};border:2.5px solid rgba(255,255,255,0.9);box-shadow:0 2px 8px rgba(0,0,0,0.3)"></div>`,
    iconSize: [24, 24],
    iconAnchor: [12, 12],
  });
}

function buildWalmartOverlay(map) {
  const HQ  = [36.3729, -94.2192];
  const RES = [36.3200, -94.1800];
  L.circle(HQ,  { radius: 2600, color: '#1f3d2a', fillColor: '#1f3d2a', fillOpacity: 0.09, weight: 2, opacity: 0.35 })
    .bindTooltip('Walmart Home Office').addTo(map);
  L.circle(RES, { radius: 2200, color: '#c8440a', fillColor: '#c8440a', fillOpacity: 0.07, weight: 2, opacity: 0.30 })
    .bindTooltip('Executive Residential Corridor').addTo(map);
  L.polyline([HQ, RES], { color: '#1f3d2a', weight: 3, opacity: 0.28, dashArray: '8 6' }).addTo(map);
}

function buildPoiOverlay(map, target) {
  const label = target.name || 'Target Location';
  L.circle([target.lat, target.lng], {
    radius: 2400, color: '#8b5cf6', fillColor: '#8b5cf6', fillOpacity: 0.08, weight: 2, opacity: 0.35,
  }).addTo(map);
  const poiIcon = L.divIcon({
    className: '',
    html: '<div style="display:flex;flex-direction:column;align-items:center;gap:4px">'
        + '<div style="width:38px;height:38px;border-radius:50%;background:#8b5cf6;border:2.5px solid rgba(255,255,255,0.9);box-shadow:0 3px 14px rgba(0,0,0,0.28);display:flex;align-items:center;justify-content:center;font-size:17px">📍</div>'
        + '<div style="white-space:nowrap;font-size:9px;font-weight:700;color:#8b5cf6;background:#fff;padding:2px 6px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,0.14)">' + esc(label) + '</div>'
        + '</div>',
    iconSize:   [80, 54],
    iconAnchor: [40, 50],
  });
  L.marker([target.lat, target.lng], { icon: poiIcon, zIndexOffset: 1000 }).addTo(map);
}

function renderMap(d) {
  const el = document.getElementById('proposal-map');
  if (!el) return;
  const screens = (d.screens || []).filter(s => s.lat && s.lng);
  if (!screens.length) return;

  const center = [
    screens.reduce((a, s) => a + s.lat, 0) / screens.length,
    screens.reduce((a, s) => a + s.lng, 0) / screens.length,
  ];
  PROPOSAL_MAP = L.map('proposal-map', { center, zoom: 11, zoomControl: true, scrollWheelZoom: false });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://carto.com/">CARTO</a>', maxZoom: 19,
  }).addTo(PROPOSAL_MAP);

  screens.forEach(s => {
    L.marker([s.lat, s.lng], { icon: screenMapIcon(s.type) })
      .bindTooltip(s.name || 'Screen', { direction: 'top', offset: [0, -14] })
      .addTo(PROPOSAL_MAP);
  });

  if (isWalmartGoal(d.goal)) {
    buildWalmartOverlay(PROPOSAL_MAP);
  } else if (d.proximityTarget && d.proximityTarget.lat && d.proximityTarget.lng) {
    buildPoiOverlay(PROPOSAL_MAP, d.proximityTarget);
  }

  try {
    PROPOSAL_MAP.fitBounds(L.latLngBounds(screens.map(s => [s.lat, s.lng])).pad(0.28));
  } catch (e) {}

  setTimeout(() => { if (PROPOSAL_MAP) PROPOSAL_MAP.invalidateSize(); }, 200);
}

function osmSrc(lat, lng) {
  const pad = 0.003;
  return `https://www.openstreetmap.org/export/embed.html?bbox=${lng - pad},${lat - pad * 0.6},${lng + pad},${lat + pad * 0.6}&layer=mapnik&marker=${lat},${lng}`;
}

/* Holds the currently rendered proposal so the CSV export button (which
   fires after renderPage() has already returned its HTML string) can
   read the same data without re-fetching or re-parsing the URL. */
let CURRENT_PROPOSAL = null;

function csvCell(v) {
  const s = (v === null || v === undefined) ? '' : String(v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function csvRow(arr) {
  return arr.map(csvCell).join(',');
}

function downloadProposalCSV() {
  const d = CURRENT_PROPOSAL;
  if (!d) return;
  const screens = d.screens || [];
  const qty     = d.qty || 1;
  const lbl     = incLabel(d.inc);
  const subUnit = screens.reduce((a, s) => a + (s.unitRate || 0), 0);
  const grand   = Math.round(subUnit * qty);
  const flightRange = fmtDateRange(d.flightStart, d.flightEnd);

  const rows = [];
  rows.push(csvRow(['NWA Ads — Campaign Proposal']));
  rows.push(csvRow(['Prepared for', d.company || '']));
  if (d.contact)      rows.push(csvRow(['Contact', d.contact]));
  if (d.contactEmail) rows.push(csvRow(['Email', d.contactEmail]));
  if (d.contactPhone) rows.push(csvRow(['Phone', d.contactPhone]));
  if (d.product)      rows.push(csvRow(['Product', d.product]));
  if (d.goal)         rows.push(csvRow(['Campaign goal', d.goal]));
  if (flightRange)    rows.push(csvRow(['Flight dates', flightRange]));
  rows.push(csvRow(['Campaign length', qty + ' ' + lbl.unit + (qty !== 1 ? 's' : '')]));
  rows.push('');
  rows.push(csvRow([
    'Screen Name', 'Type', 'Area', 'Weekly Impressions', 'CPM (USD)',
    'Rate (USD per ' + lbl.unit + ')', 'Qty (' + lbl.unit + 's) ', 'Total (USD)',
  ]));
  screens.forEach(function(s) {
    rows.push(csvRow([
      s.name || '',
      TYPE_LABEL[s.type] || s.type || '',
      s.area || '',
      s.wkly_impr || '',
      s.cpm != null ? Number(s.cpm).toFixed(2) : '',
      Math.round(s.unitRate || 0),
      qty,
      Math.round((s.unitRate || 0) * qty),
    ]));
  });
  rows.push('');
  rows.push(csvRow(['Subtotal (per ' + lbl.unit + ')', '', '', '', '', '', '', Math.round(subUnit)]));
  rows.push(csvRow(['Estimated total', '', '', '', '', '', '', grand]));

  const csvContent = rows.join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const slug = (d.company || 'campaign').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '') || 'campaign';

  const a = document.createElement('a');
  a.href = url;
  a.download = 'nwa-ads-proposal-' + slug + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ─────────────────────────────────────────
   Normalizers — both paths produce the same
   shape that renderPage() consumes.
───────────────────────────────────────── */
function normalizeSupabase(row) {
  const cartObj = row.cart && typeof row.cart === 'object' ? row.cart : {};
  const screens = Object.values(cartObj).map(function(s) {
    return {
      unitRate:  s.weeklyRate || s.wkly_rate || 0,
      wkly_impr: s.weekly_imp || s.wkly_impr || 0,
      name:      s.name || s.full_name || '',
      area:      s.area || [s.city, s.state].filter(Boolean).join(', ') || '',
      type:      s.venue_type || s.type || '',
      img:       resolveScreenImg(s),
      lat:       s.lat,
      lng:       s.lng,
      cpm:       s.cpm || null,
      audience:  s.audience || null,
      icon:      null,
    };
  });
  return {
    company:      row.company_name || '',
    contact:      row.contact_name || row.contact_email || '',
    contactEmail: row.contact_email || '',
    contactPhone: row.contact_phone || '',
    goal:         row.goal || '',
    product:      row.product || '',
    flightStart:  row.flight_start || '',
    flightEnd:    row.flight_end || '',
    inc:          row.inc || 'weekly',
    qty:          row.qty || 1,
    created:      (row.created_at || '').slice(0, 10),
    screens:      screens,
    proximityTarget: row.proximity_target || null,
  };
}

function normalizeBase64(d) {
  return {
    company:      d.company || '',
    contact:      d.contact || '',
    contactEmail: d.contactEmail || d.contact || '',
    contactPhone: d.contactPhone || '',
    goal:         d.goal || '',
    product:      d.product || '',
    flightStart:  d.flightStart || '',
    flightEnd:    d.flightEnd || '',
    inc:          d.inc || 'weekly',
    qty:          d.qty || 1,
    created:      d.created || new Date().toISOString().slice(0, 10),
    screens: (d.screens || []).map(function(s) {
      return {
        unitRate:  s.unitRate || 0,
        wkly_impr: s.wkly_impr || 0,
        name:      s.name || '',
        area:      s.area || '',
        type:      s.type || '',
        img:       s.img || null,
        lat:       s.lat,
        lng:       s.lng,
        cpm:       s.cpm || null,
        audience:  s.audience || null,
        icon:      s.icon || null,
      };
    }),
    proximityTarget: d.proximityTarget || null,
  };
}

/* ─────────────────────────────────────────
   Load proposal — supports both ?id= (Supabase)
   and ?d= (base64 encoded payload)
───────────────────────────────────────── */
async function loadProposal() {
  var params = new URLSearchParams(window.location.search);
  var id      = params.get('id');
  var encoded = params.get('d');

  if (id) {
    try {
      var cfg = window.ENV_CONFIG;
      var sb  = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
      var { data, error } = await sb.rpc('get_proposal', { p_id: id });
      if (error || !data) return null;
      return normalizeSupabase(data);
    } catch (e) {
      return null;
    }
  }

  if (encoded) {
    try {
      var json = decodeURIComponent(escape(atob(encoded)));
      return normalizeBase64(JSON.parse(json));
    } catch (e) {
      return null;
    }
  }

  return null;
}

  const photoBadge = s.img ? '📷 Screen photo' : '📍 Screen location';
  const typeLabel  = TYPE_LABEL[s.type] || (s.venue_type || s.type);

  return `
  <div class="screen-card">
    <div class="screen-media">
      ${mediaHtml}
      <div class="screen-media-gradient"></div>
      <div class="screen-type-badge">
        <span style="font-size:14px">${esc(s.icon || '')}</span>

      <div class="screen-photo-badge">${photoBadge}</div>
      <div class="screen-overlay">

        <div class="screen-overlay-area">📍 ${esc(s.area || '')}</div>
      </div>
    </div>
    <div class="screen-body">
      <div class="screen-stats">
        <div class="screen-stat">
          <div class="screen-stat-lbl">Weekly impr.</div>
          <div class="screen-stat-val">${esc(s.impr || (s.wkly_impr ? s.wkly_impr.toLocaleString() : '—'))}</div>

        <div class="screen-stat">
          <div class="screen-stat-lbl">Rate</div>

        <div class="screen-stat">

          <div class="screen-stat-val">${s.cpm != null ? '$' + Number(s.cpm).toFixed(2) : '—'}</div>
        </div>

      ${s.audience ? `<div class="screen-audience"><strong>Audience: </strong>${esc(s.audience)}</div>` : ''}
      <div class="screen-total">
        <span class="screen-total-lbl">Campaign total (${qty} ${lbl.unit}${qty !== 1 ? 's' : ''})</span>
        <span class="screen-total-val">${fmtMoney(total)}</span>

    </div>
  </div>`;
}

function renderPricingRows(screens, qty, inc) {
  const lbl = incLabel(inc);
  return screens.map(s => `
    <div class="pricing-row">
      <div class="pricing-row-left">
        <span class="pricing-row-icon">${esc(s.icon || '')}</span>
        <div>
          <div class="pricing-row-name">${esc(s.name)}</div>
          <div class="pricing-row-sub">${esc(s.area || '')} · ${esc(s.impr || '')}</div>
        </div>
      </div>
      <div class="pricing-row-right">
        <div class="pricing-row-total">${fmtMoney(s.unitRate * qty)}</div>
        <div class="pricing-row-unit">${fmtMoney(s.unitRate)}${lbl.short}</div>
      </div>
    </div>`).join('');
}

function renderPage(d) {

  const screens = d.screens || [];

  const qty     = d.qty || 1;
  const expires = expiresDate(d.created || new Date().toISOString().slice(0,10));

  const subUnit = screens.reduce((a, s) => a + (s.unitRate || 0), 0);
  const disc    = 0;
  const grand   = Math.round(subUnit * qty);

        ${flightRange ? `<div class="cover-meta-item"><span class="cover-meta-label">Flight dates</span><span class="cover-meta-val">${esc(flightRange)}</span></div>` : ''}
        ${venueMix ? `<div class="cover-meta-item"><span class="cover-meta-label">Venue mix</span><span class="cover-meta-val">${esc(venueMix)}</span></div>` : ''}
      </div>` : ''}
      ${d.note ? `
      <div class="cover-divider">
        <div class="cover-note-label">Personal note</div>
        <div class="cover-note">"${esc(d.note)}"</div>

      ${renderPricingRows(screens, qty, d.inc)}

}

/* ─────────────────────────────────────────
   Boot
───────────────────────────────────────── */
(async function boot() {
  // Show a loading state while fetching (Supabase ?id= path is async)
  document.getElementById('root').innerHTML =
    '<div style="text-align:center;padding:80px 24px;color:#9b8f7a;font-size:14px">Loading proposal…</div>';
  var d = await loadProposal();
  document.getElementById('root').innerHTML = d ? renderPage(d) : renderError();
  if (d) renderMap(d);
})();
</script>
